name: Build and publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check spec
        run: npx @openapitools/openapi-generator-cli validate -i openapi-spec/gps-routes.yaml

  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Install build tools
        run: go install gotest.tools/gotestsum@latest

      - name: Install libsqlite3-mod-spatialite
        # Makes `mod_spatialite` available on the loader path so the go-sqlite3
        # `sqlite3_spatialite` driver (Extensions: ["mod_spatialite"], see
        # db/sqlite_connect.go) actually loads it at Ping() time. This exercises
        # the Spatialite-on code path (BuildMbr/ST_Within) instead of NewSQLiteDB's
        # graceful FTS5-only fallback.
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite

      - name: Build & test SQLite (FTS5 + Spatialite)
        # go-sqlite3 is cgo, so a C toolchain (present on ubuntu-latest) + CGO are
        # required. Spatialite's load_extension is ON BY DEFAULT in go-sqlite3.
        # With libsqlite3-mod-spatialite installed above, the Spatialite-on path
        # loads here and SQLiteDialect emits BuildMbr. NewSQLiteDB still falls
        # back gracefully to plain sqlite3 when the lib is absent.
        run: |
          make build
          make test-ci

      - name: Collect test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ./test-reports/

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "./test-reports/junit.xml"
          comment: true
          include_passed: true
          detailed_summary: true

      - name: Upload coverage to Coveralls
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: profile.cov

      - name: Lint
        uses: golangci/golangci-lint-action@v9

  docker-publish:
    concurrency:
      group: "publishing"
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: "Log into registry: ${{ env.REGISTRY }}"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
          labels: |
            maintainer=rm-hull
            org.opencontainers.image.description=REST API for GPS routes (SQLite + FTS5 + Spatialite)
            org.opencontainers.image.source="https://github.com/map-services/gps-routes-api"
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64 #,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
