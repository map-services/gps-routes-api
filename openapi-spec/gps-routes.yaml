openapi: 3.0.3
info:
  title: GPS Routes API
  version: 0.0.1
  description: API to retrieve and search GPS Walking Routes
servers:
  - url: https://api.hz-nbg1.destructuring-bind.org
    description: Production / canonical API endpoint
# All endpoints exposed by this API require a valid API key sent in the
# `X-API-Key` request header. The server compares the supplied key in
# constant time against the `GPS_ROUTES_API_KEY` environment variable;
# a missing or invalid key returns `401 Unauthorized`. Only `/healthz`,
# `/ready` and CORS preflight (OPTIONS) requests bypass this check, and
# none of those are exposed by this spec.
security:
  - ApiKeyAuth: []
paths:
  /v1/gps-routes/search:
    post:
      tags:
        - routes
      operationId: search
      summary: Search for routes according to various criteria
      description: |
        Returns multiple matching summary results in JSON format.

        If `limit` is not specified it defaults to 10. The `offset` and
        `limit` values are range-checked: `offset` must be in `0..100000` and
        `limit` must be in `0..100`, otherwise a `400` is returned.

        The `boundingBox` and `nearby` attributes are mutually exclusive —
        specifying both in the same request yields a `400`.

        Each key in `facets` must be one of the supported facet fields
        (see the `facets` configuration); unknown facet fields are rejected
        with a `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Invalid request, e.g. missing or invalid request body attributes, out-of-range offset/limit, both boundingBox and nearby specified, or an unknown facet field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized — missing or invalid API key in the `X-API-Key` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests — rate limit exceeded (5 requests per second per IP).
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/gps-routes/{objectID}:
    get:
      tags:
        - routes
      operationId: fetchRecord
      summary: Retrieve metadata for the specific walking route
      description: Returns data in JSON format.
      parameters:
        - name: objectID
          in: path
          required: true
          description: The object ID exactly describing the GPS route (typically this is the MD5 hash of the route reference)
          schema:
            type: string
            example: 4a2bb897585c84113beeb3f2691d9042
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteMetadata"
        "400":
          description: Invalid request, e.g. missing or invalid path parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized — missing or invalid API key in the `X-API-Key` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found, e.g. no such record for the specified object ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests — rate limit exceeded (5 requests per second per IP).
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/gps-routes/ref-data:
    get:
      tags:
        - routes
      operationId: refData
      summary: Retrieve reference data for the API
      description: Returns the available facet values together with the attribution strings used by the API.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefData"
        "401":
          description: Unauthorized — missing or invalid API key in the `X-API-Key` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests — rate limit exceeded (5 requests per second per IP).
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for authenticating requests. Supply a valid key issued by the
        API operator in the `X-API-Key` header. Requests missing this header
        or with an invalid key are rejected with `401 Unauthorized`.
  schemas:
    # A latitude/longitude pair. Used for the `_geoloc` field of route objects.
    # NOTE: the API serializes this as `_geoloc` ({lat, lng}), not as a GeoJSON
    # `location` Point — keep these in sync with `models/common/geoloc.go`.
    GeoLocation:
      type: object
      description: A geographic latitude/longitude pair
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: float
          description: Latitude
          example: 53.31721
        lng:
          type: number
          format: float
          description: Longitude
          example: -1.62343

    RouteSummary:
      type: object
      required:
        - objectID
        - ref
        - title
        - description
        - _geoloc
      properties:
        objectID:
          type: string
          description: The object ID identifies the GPS route (typically this is the MD5 hash of the route reference)
          example: 0a0cafcd50f17284dc578271968f8341
        ref:
          type: string
          description: A human friendly unique identifier for the route.
          example: daneshill-lakes-walking-route
        title:
          type: string
          description: The route title
          example: Daneshill Lakes - Retford Walking Route
        description:
          type: string
          description: Typically a long passage of text describing aspects of the route
          example: This easy walk takes you around the lovely Daneshill Lakes Nature Reserve near Retford. There's wetlands, woodland, grassland, flowering plants and lots of wildlife to look out for on the site. Look out for grebes, swans, willow warbler, whitethroat, and blackcap on your walk. There's a free on-site car park from which you can start the walk. To the south there's the more popular open water section, while to the north there's some peaceful woodland trails to enjoy. The reserve is located just to the west of Idle Valley Nature Reserve. The expansive reserve covers 450 hectares with hundreds of species of wetland birds to look out for. To the south of the site you can pick up the Chesterfield Canal to continue your waterside walking. The towpath can be followed into Retford or towards Ranby.
        headline_image_url:
          type: string
          format: url
          nullable: true
          description: The main image URL associated with the route
          example: "https://upload.wikimedia.org/wikipedia/commons/e/e5/Daneshill_Lakes_-_Car_Park_Entrance_-_geograph.org.uk_-_674042.jpg"
        distance_km:
          type: number
          format: float
          description: A rough distance indicating the length of the route
          example: 1.7
        _geoloc:
          $ref: "#/components/schemas/GeoLocation"
          description: The geographic location (latitude/longitude) of the route

    RouteMetadata:
      allOf:
        - $ref: "#/components/schemas/RouteSummary"
        - type: object
          required:
            - created_at
          properties:
            created_at:
              type: string
              format: date-time
              description: The time the route was generated.
              example: 2024-12-18T16:35:30.796469+00:00
            nearby:
              type: array
              description: Nearby walking routes, each returned as a full RouteSummary.
              items:
                $ref: "#/components/schemas/RouteSummary"
            details:
              type: array
              description: Supplementary detail sections (subtitle + content) for the route.
              items:
                $ref: "#/components/schemas/Detail"
            gpx_url:
              type: string
              format: url
              description: URL pointing to the associated GPX route data
            images:
              type: array
              items:
                $ref: "#/components/schemas/Image"
            video_url:
              type: string
              format: url
              nullable: true
              description: A link to a (YouTube) video associated with the route
              example: "https://www.youtube.com/embed/U8pyBfqKKhE"
            display_address:
              type: string
              nullable: true
              description: A human-friendly display address for the route start
              example: Surprise View, A6187, Grindleford, Derby...
            postcode:
              type: string
              nullable: true
              description: Where exists, a nearby postcode
              example: S32 2HY
            district:
              type: string
              nullable: true
              description: The district in which the route starts
              example: Derbyshire Dales
            county:
              type: string
              nullable: true
              description: The county in which the route starts
              example: Derbyshire
            region:
              type: string
              nullable: true
              description: The region in which the route starts
              example: East Midlands
            state:
              type: string
              nullable: true
              description: The state/country subdivision in which the route starts
              example: England
            country:
              type: string
              nullable: true
              description: The country in which the route starts
              example: United Kingdom
            estimated_duration:
              type: string
              nullable: true
              description: An estimated duration for completing the route
              example: "1 hour"
            difficulty:
              type: string
              nullable: true
              description: The difficulty grade of the route
              example: moderate
            terrain:
              type: array
              nullable: true
              description: The terrain types involved in the route
              items:
                type: string
            points_of_interest:
              type: array
              nullable: true
              description: Points of interest along the route
              items:
                type: string
            facilities:
              type: array
              nullable: true
              description: Facilities available along the route
              items:
                type: string
            route_type:
              type: string
              nullable: true
              description: The type of route (e.g. circular)
              example: circular
            activities:
              type: array
              nullable: true
              description: Activities the route is suitable for
              items:
                type: string

    # NOTE: this is NOT the same as a nearby route reference — see RouteSummary
    # for the full objects returned in RouteMetadata.nearby. This schema
    # describes the search request filter for nearby-place lookups.
    NearbyFilter:
      type: object
      description: A nearby-place filter for search requests. Mutually exclusive with `boundingBox`.
      required:
        - place
        - distanceKm
      properties:
        place:
          type: string
          description: A place name to resolve via the OS Names API for proximity search.
          example: Hathersage
        center:
          $ref: "#/components/schemas/GeoLocation"
          description: The resolved latitude/longitude center used for proximity search.
        distanceKm:
          type: integer
          description: The search radius in kilometers
          example: 10

    Image:
      type: object
      required:
        - src
      properties:
        src:
          type: string
          format: url
          description: A URL referencing an image
          example: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Footpath_and_meadow_at_Daneshill_Lakes_reserve_-_geograph.org.uk_-_1948823.jpg/512px-Footpath_and_meadow_at_Daneshill_Lakes_reserve_-_geograph.org.uk_-_1948823.jpg"
        title:
          type: string
          description: Description, typically containing some attribution for the image
          example: Footpath and meadow at Daneshill Lakes reserve by Andrew Hill, CC BY-SA 2.0 <https://creativecommons.org/licenses/by-sa/2.0>, via Wikimedia <https://creativecommons.org/licenses/by-sa/2.0>
        caption:
          type: string
          description: Appropriate image caption
          example: Footpath and meadow

    Detail:
      type: object
      description: A supplementary detail section for a route
      required:
        - subtitle
        - content
      properties:
        subtitle:
          type: string
          description: The subtitle / heading for the detail section
          example: Pubs/Cafes
        content:
          type: string
          description: The body content for the detail section
          example: Head to the nearby Millstone Inn for some well earned post walk refreshments.

    SearchRequest:
      type: object
      properties:
        query:
          type: string
          description: >-
            Optional full-text search phrase using SQLite FTS5. When omitted, the
            search returns all routes matching other criteria (e.g. bounding box or
            nearby filter). Searches three columns with different relevance weights:
            `title` (highest), `display_address` (medium), and `description` (lowest).
            Every query is automatically converted to a prefix search — each word gets
            a wildcard (`*`) appended, so "canal walk" matches "canal walk", "canal
            walking", "canal walker", etc.

            Supported FTS5 operators:

            * Plain words — prefix match, words are ANDed (e.g. "canal walking"
              matches "canal*" AND "walking*")
            * `"quoted phrase"` — exact phrase match, no prefix expansion
              (e.g. "river walk" matches the exact phrase)
            * `NEAR/n` — words within n tokens of each other
              (e.g. "canal" NEAR/5 "bridge")
            * `-term` — exclude routes containing the term
              (e.g. "walking -cycling")
            * `term1 OR term2` — match either term (e.g. "river OR canal")
            * `*` — explicit wildcard (also added automatically)
          example: coffee -tea shop
        offset:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
          description: The number of results to skip (paged search)
        limit:
          type: integer
          minimum: 0
          maximum: 100
          default: 10
          description: The maximum number of results to return. Defaults to 10 when omitted or 0.
        boundingBox:
          type: array
          description: The bounding box with bottom-left lng/lat, followed by top-right lng/lat. Mutually exclusive with `nearby`.
          items:
            type: number
            format: float
          example:
            [
              -2.9769945144653325,
              54.41890499817318,
              -2.945623397827149,
              54.43847718997843,
            ]
        facets:
          type: object
          description: Filtering by facet values. Each key must be a supported facet field.
          additionalProperties:
            type: array
            items:
              type: string
        nearby:
          $ref: "#/components/schemas/NearbyFilter"
          description: A nearby-place filter for proximity search. Mutually exclusive with `boundingBox`.
          example:
            place: Hathersage
            distanceKm: 10
        truncateText:
          type: boolean
          description: When true, truncate the long description text returned in summary results
          example: true
        skipFacets:
          type: boolean
          description: When true, skip computing facet counts in the search response
          example: false

    SearchResults:
      type: object
      required:
        - total
        - hits
        - offset
        - limit
        - hasMore
      properties:
        total:
          type: integer
          format: int64
          description: The total number of matching routes
          example: 7069
        hits:
          type: array
          description: The matching route summaries (page of results)
          items:
            $ref: "#/components/schemas/RouteSummary"
        facets:
          type: object
          description: A map of facet field name to a map of facet-value -> count
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
              format: int64
        attribution:
          type: array
          description: Attribution strings for the data sources used by the API
          items:
            type: string
        offset:
          type: integer
          format: int32
          description: The pagination offset used for this page of results
          example: 0
        limit:
          type: integer
          format: int32
          description: The page size used for this page of results (defaults to 10 when omitted)
          example: 10
        hasMore:
          type: boolean
          description: True when there are more results available beyond this page
          example: true
        nextOffset:
          type: integer
          format: int32
          description: The offset to use in the next request to fetch the following page (omitted when hasMore is false)
          example: 10

    RefData:
      type: object
      description: "Reference data for the API: all available facet values with counts plus attribution"
      properties:
        facets:
          type: object
          description: A map of facet field name to a map of facet-value -> count
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
              format: int64
        attribution:
          type: array
          description: Attribution strings for the data sources used by the API
          items:
            type: string

    ErrorResponse:
      type: object
      description: |
        A consistent error response returned by all endpoints on error. The `code`
        field indicates the error type: `INVALID_REQUEST` for bad input,
        `VALIDATION_ERROR` for field-level validation failures (includes the
        `field` attribute), `UNAUTHORIZED` for auth errors, `NOT_FOUND` for
        missing resources, and `INTERNAL_ERROR` for server errors.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: |
                A machine-readable error code. Possible values: `INVALID_REQUEST`,
                `VALIDATION_ERROR`, `UNAUTHORIZED`, `NOT_FOUND`, `INTERNAL_ERROR`.
              example: VALIDATION_ERROR
            message:
              type: string
              description: A human-readable error message describing what went wrong.
              example: "limit must be between 0 and 100"
            field:
              type: string
              description: |
                The request field that caused the validation error (present only
                when code is `VALIDATION_ERROR`).
              example: limit
